name: Verify

# A pull request is tested as a pull request, and main on each push. A push to main that merges a
# pull request is usually not tested again: see `tested`. In the public repo, releases arrive as
# pushes to main with no pull request behind them, so each release gets the full run.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request cancels the older run, whose answer is about code nobody will
# merge. Each push to main gets a group of its own and is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'ref' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# No Cloudflare credentials anywhere in this workflow: it only tests.
jobs:
  # Has this exact tree of files already passed? A push to main is usually a merge, and the pull
  # request behind it tested the same files minutes earlier: the commit is new, the tree is not.
  #
  # The claim needs three things: a candidate commit with the same tree, a successful run of this
  # workflow at it, and that run's own record (the receipt `test` uploads) that it checked out
  # this tree. A pull request run tests the merge of head and base, not the head, so a green run
  # at the head proves this tree only if its receipt names it.
  #
  # The candidates are a merge commit's second parent and the head of the pull request this
  # commit closed, which covers merge and squash merges. Anything that fails to answer counts as
  # "not proved", and the tests run.
  tested:
    # A pull request's merge tree can equal its head while the head is exactly what hasn't been
    # tested, so the question is only asked on a push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job's block replaces the workflow's. Still read-only: these let it read a commit's tree
    # and a run's result.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      already: ${{ steps.proved.outputs.already }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Look for a green run of this tree
        id: proved
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: verify.yml
          RECEIPT: tested-tree
        run: |
          tree=$(git rev-parse "HEAD^{tree}")
          echo "this tree: $tree"
          second=$(git rev-parse --verify --quiet "HEAD^2" || true)
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
                   --jq '.[].head.sha' 2>/dev/null || true)
          for candidate in $second $head; do
            candidate_tree=$(gh api "repos/$GITHUB_REPOSITORY/commits/$candidate" \
                               --jq '.commit.tree.sha' 2>/dev/null) || continue
            if [ "$candidate_tree" != "$tree" ]; then
              echo "$candidate: different tree ($candidate_tree)"
              continue
            fi
            run=$(gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/$WORKFLOW/runs?head_sha=$candidate&status=success&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null) || continue
            if [ -z "$run" ]; then
              echo "$candidate: same tree, no green run of $WORKFLOW"
              continue
            fi
            if gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts" \
                 --jq '.artifacts[].name' 2>/dev/null | grep -qxF "$RECEIPT-$tree"; then
              echo "already=true" >> "$GITHUB_OUTPUT"
              echo "$candidate: run $run checked out this exact tree and was green" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "$candidate: green run $run carries no $RECEIPT-$tree receipt"
          done
          echo "already=false" >> "$GITHUB_OUTPUT"
          echo "no commit with this tree has a green run; the tests run" | tee -a "$GITHUB_STEP_SUMMARY"

  test:
    # `always()` lets a pull request through, where `tested` is skipped; without it a skipped
    # dependency skips this job too.
    needs: tested
    if: always() && needs.tested.outputs.already != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      # The receipt `tested` reads: the tree this run checked out. It counts only if the run
      # succeeds, since `tested` asks only about successful runs.
      - name: Record the tree this run checked out
        id: receipt
        run: |
          t=$(git rev-parse "HEAD^{tree}")
          echo "$t" > "$RUNNER_TEMP/tested-tree.txt"
          echo "name=tested-tree-$t" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ steps.receipt.outputs.name }}
          path: ${{ runner.temp }}/tested-tree.txt
          retention-days: 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Firefox and WebKit (Safari's engine) too, in a public repo only, where Actions minutes are
  # free. A private repo pays for its minutes and stays on Chromium.
  browsers:
    needs: tested
    if: always() && needs.tested.outputs.already != 'true' && !github.event.repository.private
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run setup
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:e2e:browsers

  # Runs on every event: a merge adds commits to the history, and this reads all of it. One
  # version, checked against the checksum its project publishes, so a new gitleaks can't change
  # this result or reach the runner unnoticed.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the pinned gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          dir="$(mktemp -d)"
          curl -fsSL -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $dir/$archive" | sha256sum -c -
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: No secrets in the full history
        run: gitleaks git . --no-banner --redact --exit-code 1

  # The one check that stands for every job above, for a branch rule to require. A skip counts
  # as green only where this workflow chose it: the tree was already proved, or the repo is
  # private and has no browsers job. Any other skip, such as a cancelled dependency, says
  # nothing about the code and fails here. Don't relax this to "success or skipped".
  gate:
    needs: [tested, test, browsers, gitleaks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job green, or skipped because this workflow chose to skip it
        run: |
          echo "tested=${{ needs.tested.outputs.already }} test=${{ needs.test.result }}" \
               "browsers=${{ needs.browsers.result }} gitleaks=${{ needs.gitleaks.result }}"
          want=success
          if [ "${{ needs.tested.outputs.already }}" = "true" ]; then
            want=skipped
            echo "the pull request behind this merge proved this tree; the tests were skipped" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          browsers=$want
          if [ "${{ github.event.repository.private }}" = "true" ]; then browsers=skipped; fi
          [ "${{ needs.test.result }}" = "$want" ] || exit 1
          [ "${{ needs.browsers.result }}" = "$browsers" ] || exit 1
          [ "${{ needs.gitleaks.result }}" = "success" ] || exit 1
